name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff format check
        run: source .venv/bin/activate && ruff format --check src tests
      - name: Ruff lint
        run: source .venv/bin/activate && ruff check src tests
      - name: Pytest
        run: source .venv/bin/activate && pytest -v
      - name: Build check
        run: source .venv/bin/activate && python -m build
